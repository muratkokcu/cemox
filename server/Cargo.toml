[package]
name = "cemox-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
# Kripto arka ucu açıkça seçilir: ağaçta hem ring hem aws-lc-rs bulunduğu için
# jsonwebtoken kendiliğinden seçemiyor ve imzalama sırasında panikliyor.
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "builder", "pool", "ring", "webpki-roots"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "form", "http2", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
